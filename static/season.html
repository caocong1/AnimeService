<main id="main">
  <header class="page-head"><h1>新番</h1><p class="meta" id="summary"></p>
    <div class="tools"><button class="btn small quiet" type="button" id="sync"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>刷新目录</button></div>
