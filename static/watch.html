<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>放映室 · 番屿</title>
<meta name="theme-color" content="#1f1e1c">
<link rel="icon" href="/static/icon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/watch-controls.css?v=6">
<script src="/static/theme.js"></script>
</head>
<body class="watch">
<main id="main">
  <div class="cinema">
    <div>
      <div class="screen-wrap"><div id="screen"></div><div class="screen-state" id="screen-state"><span>正在打开…</span></div></div>
      <div class="now">
        <div class="what"><a id="parent" href="/library"></a><h1 id="title">放映室</h1></div>
        <div class="acts" id="acts"></div>
      </div>
      <div class="playback-controls">
      <div class="watch-tools">
        <label>字幕 <select id="subtitle" disabled><option value="">关闭</option></select></label>
        <button class="dm-toggle" id="toggle-danmu" type="button" aria-expanded="false" aria-controls="danmu-panel" aria-label="弹幕设置">弹幕 <b id="danmu-note" aria-live="polite">—</b><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>
      </div>
      <p id="sub-note" class="dm-tools-note"></p>
      <section class="dm-panel" id="danmu-panel" aria-label="弹幕设置" hidden>
        <div class="dm-heading"><h2>正在使用</h2><button class="btn primary" id="open-danmu-search" type="button">＋ 添加来源</button></div>
        <div id="danmu-selected" class="dm-sources"><p class="dm-empty">正在匹配本集弹幕…</p></div>
        <div class="dm-heading dm-display-heading"><h2>显示</h2><button class="btn quiet" id="danmu-display-reset" type="button">恢复默认</button></div>
        <div class="dm-display">
          <label>移动速度 <input type="range" id="dm-speed" min="1" max="10" step="1"><output for="dm-speed" id="dm-speed-out"></output></label>
          <label>字号 <input type="range" id="dm-font-size" min="12" max="50" step="1"><output for="dm-font-size" id="dm-font-size-out"></output></label>
          <label>不透明度 <input type="range" id="dm-opacity" min="0.1" max="1" step="0.05"><output for="dm-opacity" id="dm-opacity-out"></output></label>
          <label>字体 <select id="dm-font"><option value="default">默认黑体</option><option value="sans">系统无衬线</option><option value="serif">宋体</option><option value="kai">楷体</option></select></label>
        </div>
        <details class="dm-more dm-global" id="dm-blocked"><summary>已屏蔽用户 <b id="dm-blocked-count">0</b></summary><div class="dm-more-body" id="dm-blocked-list"></div></details>
        <details class="dm-more dm-global"><summary>高级设置</summary><div class="dm-more-body"><label>全部来源微调 <input id="offset" type="number" min="-3600" max="3600" step="0.5" value="0"> 秒</label><p>正数延后，负数提前。调时保存在此浏览器，自动恢复。</p><div><button class="btn" id="retry-danmu" type="button" disabled>重新匹配本集</button></div></div></details>
      </section>
      </div>
    </div>
    <aside class="side" aria-label="分集与弹幕">
      <div class="side-tabs" role="tablist">
        <button type="button" role="tab" id="tab-playlist" aria-controls="playlist" aria-selected="true">分集</button>
        <button type="button" role="tab" id="tab-danmu-list" aria-controls="danmu-list" aria-selected="false" tabindex="-1">弹幕列表 <b id="danmu-list-count"></b></button>
      </div>
      <div class="playlist" id="playlist" role="tabpanel" aria-labelledby="tab-playlist"></div>
      <div class="dm-list" id="danmu-list" role="tabpanel" aria-labelledby="tab-danmu-list" hidden>
        <div class="dm-list-head" aria-hidden="true"><span>时间</span><span>弹幕内容</span></div>
        <div class="dm-list-scroll" id="danmu-list-scroll" tabindex="0" aria-label="弹幕列表，随播放滚动；右键可屏蔽发送者"><div class="dm-list-space" id="danmu-list-space"></div></div>
        <p class="dm-list-hint">右键弹幕可屏蔽发送者</p>
      </div>
    </aside>
  </div>
</main>
<dialog class="dm-dialog" id="danmu-dialog" aria-labelledby="danmu-dialog-title">
  <header class="dm-dialog-head"><h2 id="danmu-dialog-title">添加弹幕来源</h2><button class="icon-btn" id="close-danmu-search" type="button" aria-label="关闭添加来源">×</button></header>
  <div class="dm-dialog-body">
    <div id="danmu-search-view"><form id="danmu-search" class="dm-search"><label class="sr" for="danmu-q">作品名或视频链接</label><input id="danmu-q" type="search" name="query" required maxlength="100" placeholder="作品名、集数或视频链接"><button class="btn" type="submit">搜索</button></form><p class="dm-dialog-hint" id="danmu-results-note">本集相关视频 · 选择后核对分集</p><div id="danmu-results" class="dm-results" aria-live="polite"></div></div>
    <div id="danmu-detail-view" hidden><button class="btn quiet" id="danmu-back" type="button">‹ 返回搜索结果</button><div id="danmu-episodes" class="dm-detail"></div></div>
  </div>
</dialog>
<div class="dm-menu" id="danmu-menu" role="menu" aria-label="弹幕操作" tabindex="-1" hidden><p id="danmu-menu-text"></p><button type="button" role="menuitem" id="danmu-block-user">屏蔽此用户</button><button type="button" role="menuitem" id="danmu-find-user" hidden>查找 B站用户</button><div class="dm-uids" id="danmu-menu-uids" hidden></div></div>
<script src="/static/core.js?v=2"></script>
<script src="/static/vendor/artplayer.js"></script>
<script src="/static/vendor/artplayer-plugin-danmuku.js"></script>
<script src="/static/vendor/libass/subtitles-octopus.js"></script>
<script src="/static/subtitle-renderer.js?v=2"></script>
<script src="/static/danmu-timing.js?v=6"></script>
<script src="/static/bili-uid.js?v=1"></script>
<script src="/static/danmu-alignment.js?v=2"></script>
<script src="/static/watch.js?v=12"></script>
</body>
</html>
