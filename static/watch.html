<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>放映室 · 番屿</title>
<meta name="theme-color" content="#1f1e1c">
<link rel="icon" href="/static/icon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body class="watch">
<main id="main">
  <div class="cinema">
    <div>
      <div class="screen-wrap"><div id="screen"></div><div class="screen-state" id="screen-state"><span>正在打开…</span></div></div>
      <div class="now">
        <div class="what"><a id="parent" href="/library"></a><h1 id="title">放映室</h1></div>
        <div class="acts" id="acts"></div>
      </div>
      <div class="tracks">
        <label>字幕 <select id="subtitle" disabled><option value="">关闭</option></select></label>
        <span id="sub-note"></span>
        <span>弹幕 <b id="danmu-note">—</b></span>
        <button class="btn small quiet" type="button" id="retry-danmu" disabled>重新匹配</button>
      </div>
      <details class="more watch-extra" id="danmu-more">
        <summary>弹幕来源与时间轴<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5.5 6.5 6.5L9 18.5"/></svg></summary>
        <div class="body danmu-panel">
          <form id="danmu-search" class="row"><label class="sr" for="danmu-q">作品名</label><input id="danmu-q" name="query" required maxlength="100" placeholder="作品名"><button class="btn" type="submit">搜索</button></form>
          <div id="danmu-results" class="links"></div>
          <div id="danmu-episodes" class="row"></div>
          <div id="danmu-selected" class="list-rows"></div>
          <div class="row"><button class="btn" type="button" id="load-danmu">加载所选来源</button><label class="field" style="grid-auto-flow:column;align-items:center">偏移（秒）<input id="offset" type="number" min="-3600" max="3600" step="0.5" value="0"></label></div>
        </div>
      </details>
    </div>
    <aside class="playlist" id="playlist" aria-label="分集"></aside>
  </div>
</main>
<script src="/static/core.js"></script>
<script src="/static/vendor/artplayer.js"></script>
<script src="/static/vendor/artplayer-plugin-danmuku.js"></script>
<script src="/static/watch.js"></script>
</body>
</html>
