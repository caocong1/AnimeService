<body><main id="main"><header class="page-head"><div><h1>字幕库</h1><p class="meta" id="summary" role="status">正在读取交付进度…</p></div><div class="tools"><a class="btn quiet" href="/subtitle-queue">制作队列</a><button class="btn quiet" id="delivery-refresh" type="button">刷新进度</button></div></header>
<p class="muted">看已做好的成品，了解下一集的素材和制作进度。先看v0观看版，随后提供v1精校细调版；两个版本均保留供选择。</p>
<nav id="delivery-filters" class="delivery-filters" aria-label="交付状态筛选"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="done" aria-pressed="false">已做好</button><button type="button" data-filter="making" aria-pressed="false">制作中</button><button type="button" data-filter="preparing" aria-pressed="false">准备中</button><button type="button" data-filter="waiting" aria-pressed="false">待开始</button></nav>
