<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>连接 · 番屿</title>
<meta name="theme-color" content="#1f1e1c">
<link rel="icon" href="/static/icon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body class="login">
<main class="login-card">
  <span class="brand"><img src="/static/icon.svg" alt="" width="32" height="32"><span>番屿</span></span>
  <form id="login-form">
    <label class="field" for="pair-code"><span>配对码</span></label>
    <input id="pair-code" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="16" required>
    <button class="btn primary" type="submit">连接</button>
    <p id="login-message" class="error-line" role="alert"></p>
  </form>
  <p class="muted">配对码在家中电脑的 后台 › 设置 › 设备 生成</p>
</main>
<script src="/static/login.js"></script>
</body>
</html>
