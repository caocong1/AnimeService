<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>追番 · 番屿</title>
<meta name="theme-color" content="#1f1e1c">
<link rel="icon" href="/static/icon.svg">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/tokens.css">

<body>
<main id="main">
  <header class="page-head"><h1>追番</h1><p class="meta" id="summary"></p></header>

    <section class="screens" id="screens" aria-label="可以看的"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>

      <div class="seg" id="state-filter" role="group" aria-label="按状态筛选"></div>
      <label class="search"><span class="sr">搜索追番</span><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="q" type="search" placeholder="搜索" autocomplete="off"></label>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>
