name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install ffmpeg for media tests
        # requires_ffmpeg tests are skipped with a visible reason if this install fails.
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress
      # Tests marked requires_lab need the private subtitle core and are reported as skipped here;
      # the original machine runs them. Anything else failing is a real regression.
      # -rfEs lists failures and errors as well as skip reasons in the short summary.
      - run: python -m pytest -q -rfEs --durations=25
      # The frontend checks still run (and report) when pytest is red; the job still fails.
      - if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend behavior regressions
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $nodeTests = @(Get-ChildItem tests -Filter '*.test.cjs' | ForEach-Object { $_.FullName })
          node --test @nodeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/subtitle-delivery-model.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Static JS syntax
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Get-ChildItem static/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
