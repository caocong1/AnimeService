name: Android

# Non-production debug build of the TV client with its unit tests and lint; runs only when tv/ changes.
# JDK 17, SDK platform 36 and build-tools 36.0.0 are pinned here; the wrapper, AGP, Kotlin and
# dependencies stay whatever tv/ declares. assembleDebug uses the SDK's temporary debug signing:
# nothing here is a release build, no keystore or secret is read, and no APK is published. Only the
# test and lint reports are kept, for a week. Signed publishing stays on the original machine
# (`./gradlew publishRelease`, DEVELOPMENT.md).
on:
  push:
    paths: ['tv/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['tv/**', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # dependency and wrapper caches only; written on main pushes, read-only elsewhere
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests (debug variant)
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Lint (debug variant)
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug
      - name: Non-production debug build
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fanyu-tv-reports
          path: |
            tv/app/build/reports/**
            tv/app/build/test-results/**
          retention-days: 7
          if-no-files-found: warn
